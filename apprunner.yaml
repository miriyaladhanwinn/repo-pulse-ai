version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm ci --prefer-offline --no-audit
      - npm run build --if-present
run:
  runtime-version: 22
  command: npm run mcp:http
  network:
    port: 3001
    env: PORT
  env:
    - name: NODE_ENV
      value: "production"
    - name: AWS_REGION
      value: "us-east-1"
    - name: REPOPULSE_JUDGE_MODE
      value: "true"
