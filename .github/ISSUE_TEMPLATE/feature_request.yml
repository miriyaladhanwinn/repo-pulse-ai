name: 💡 Feature Request / RFC
description: Suggest a new capability or architectural enhancement
labels: ["enhancement", "rfc"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome community proposals! Please describe the use case clearly.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Is your feature request related to a problem or maintainer workflow limitation?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Architecture
      description: Describe your proposed design or API surface change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've explored.
