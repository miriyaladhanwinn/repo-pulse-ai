name: 🐛 Bug Report
description: File a reproducible bug report for RepoPulse AI
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you have tested against the latest version.
  - type: input
    id: version
    attributes:
      label: RepoPulse Version
      description: What version are you using? (e.g. 2.0.0)
      placeholder: "2.0.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal Reproduction Steps
      description: Steps or code snippet to trigger the fault.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
