name: "Bug Report"
description: "Report a bug or unexpected behavior in RepoPulse AI"
labels: ["bug", "triage-needed"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting an issue! Please provide detailed reproduction steps."
  - type: input
    id: version
    attributes:
      label: "RepoPulse Version"
      placeholder: "v2.3.1"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      placeholder: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      placeholder: "1. Run command '...'\n2. Inspect AST output..."
    validations:
      required: true
