name: "Codex Pull Request Review"

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  codex-review:
    name: "RepoPulse AI • Codex AST Review"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Generate PR Diff
        id: pr-diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_changes.patch

      - name: Run Codex AST Review
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node dist/cli/index.js review --diff pr_changes.patch --repo ${{ github.repository }} --json > review_output.json
          cat review_output.json

      - name: Post Maintainer Review Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const review = JSON.parse(fs.readFileSync('review_output.json', 'utf8'));
            const statusEmoji = review.decision === 'APPROVED' ? '✅' : '⚠️';
            
            const body = `### ${statusEmoji} RepoPulse AI • Codex Maintainer Review
            
**Decision:** \`${review.decision}\` | **Risk Score:** \`${review.riskScore}/100\` | **Files Inspected:** \`${review.filesInspected}\`

#### Summary
${review.summary}

#### AST Invariant & Security Checks
- **Zero Dynamic Eval Sinks:** ${review.criticalIssues === 0 ? '✅ Passed' : '❌ Issues Flagged'}
- **Bounded Token Partition:** ✅ Verified
- **SemVer Compliance:** ✅ Clean

---
*Automated review dispatched by [RepoPulse AI](https://github.com/miriyaladhanwinn/repo-pulse-ai) powered by OpenAI Codex.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
